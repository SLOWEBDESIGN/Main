[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_GA_ID = "G-3SD2928MVG"
  NEXT_PUBLIC_CALENDLY_URL = "https://calendly.com/contact-slowebdesign/30min"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── 3D Print Dash service site ────────────────────────────────────────────────────────
# The status / blog / changelog / incidents / security / subprocessors pages for 3D Print
# Dash are hosted out of this site's public/3dprintdash/ as plain static HTML.
#
# Why here, on somebody else's site: a status page must not share infrastructure with the
# app it reports on, or it goes down at the only moment anyone needs it. This repo is on
# Netlify and the app is on Vercel, which is exactly the separation that buys.
#
# These rewrites serve those files at the ROOT of status.3dprintdash.com, so the public
# URLs are status.3dprintdash.com/status and so on, with no /3dprintdash/ in them and
# nothing about 3D Print Dash appearing on slowebdesign.com's own pages.
#
# OWNER: add status.3dprintdash.com as a domain on this Netlify site, and point a CNAME at
# it, or these rules never match anything.
[[redirects]]
  from = "https://status.3dprintdash.com/*"
  to = "/3dprintdash/:splat"
  status = 200
  force = true

[[redirects]]
  from = "http://status.3dprintdash.com/*"
  to = "/3dprintdash/:splat"
  status = 200
  force = true

# Pretty URLs for the static pages.
#
# These files live in public/, which Next.js serves by EXACT path only: it does not resolve
# /3dprintdash/status/ to that folder's index.html the way a plain static server does. That
# difference is easy to miss, because testing with `python3 -m http.server` resolves it and
# production does not.
#
# Not forced, so a real file always wins and these only fill the gap. Harmless if Netlify's
# own static layer already handles it.
[[redirects]]
  from = "/3dprintdash"
  to = "/3dprintdash/index.html"
  status = 200

[[redirects]]
  from = "/3dprintdash/status"
  to = "/3dprintdash/status/index.html"
  status = 200

[[redirects]]
  from = "/3dprintdash/blog"
  to = "/3dprintdash/blog/index.html"
  status = 200

[[redirects]]
  from = "/3dprintdash/changelog"
  to = "/3dprintdash/changelog/index.html"
  status = 200

[[redirects]]
  from = "/3dprintdash/incidents"
  to = "/3dprintdash/incidents/index.html"
  status = 200

[[redirects]]
  from = "/3dprintdash/security"
  to = "/3dprintdash/security/index.html"
  status = 200

[[redirects]]
  from = "/3dprintdash/subprocessors"
  to = "/3dprintdash/subprocessors/index.html"
  status = 200

# Individual blog posts, once there are any: /3dprintdash/blog/<slug> -> its index.html
[[redirects]]
  from = "/3dprintdash/blog/:slug"
  to = "/3dprintdash/blog/:slug/index.html"
  status = 200

# The status page must always be fresh; a cached "all systems operational" during an
# outage is worse than no status page.
[[headers]]
  for = "/3dprintdash/status/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/3dprintdash/incidents/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
