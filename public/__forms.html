<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms detection</title>
  </head>
  <body>
    <!--
      Static form definition required by the Next.js Runtime v5 (@netlify/plugin-nextjs v5).
      The runtime no longer parses framework-generated HTML for forms, so this plain
      HTML file is what Netlify scans at build time to register the "contact" form.
      The interactive form lives in src/components/ContactForm.tsx and POSTs to
      /__forms.html. Field names here MUST match the fields submitted by that form.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="url" name="website" />
      <input type="text" name="businessType" />
      <input type="text" name="budget" />
      <input type="text" name="services" />
      <textarea name="description"></textarea>
      <input type="text" name="contactMethod" />
    </form>
  </body>
</html>
