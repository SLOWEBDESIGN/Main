<svg width="1200" height="750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .modern-bg { fill: #fafaf8; }
      .modern-header { fill: #3d5e3f; }
      .modern-text { font-family: 'Segoe UI', system-ui, sans-serif; fill: #333; }
      .modern-accent { fill: #3d5e3f; }
      .modern-light { fill: #f5faf7; }
      .modern-nav { fill: #fafaf8; font-size: 14px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" class="modern-bg"/>

  <!-- Header (modern) -->
  <rect width="1200" height="70" class="modern-header"/>
  <text x="30" y="45" font-size="28" class="modern-nav" font-weight="600">ModernCo</text>

  <!-- Clean navigation -->
  <text x="700" y="45" font-size="14" class="modern-nav" font-weight="400">Home</text>
  <text x="800" y="45" font-size="14" class="modern-nav" font-weight="400">Services</text>
  <text x="920" y="45" font-size="14" class="modern-nav" font-weight="400">About</text>
  <text x="1030" y="45" font-size="14" class="modern-nav" font-weight="400">Contact</text>

  <!-- Hero section -->
  <rect x="40" y="100" width="1120" height="200" class="modern-light" rx="8"/>
  <text x="60" y="140" font-size="36" class="modern-accent" font-weight="600">Modern Website Design</text>
  <text x="60" y="185" font-size="16" class="modern-text" fill="#666">Beautiful. Fast. Responsive. Professional.</text>
  <text x="60" y="215" font-size="14" class="modern-text" fill="#999">Designed for conversion and growth</text>

  <!-- Service cards (grid layout) -->
  <!-- Card 1 -->
  <rect x="40" y="340" width="340" height="180" class="modern-light" stroke="#3d5e3f" stroke-width="1" rx="8"/>
  <text x="60" y="375" font-size="16" class="modern-accent" font-weight="600">Responsive Design</text>
  <text x="60" y="405" font-size="13" class="modern-text" fill="#666">Looks perfect on all devices</text>
  <circle cx="290" cy="400" r="20" class="modern-accent"/>

  <!-- Card 2 -->
  <rect x="430" y="340" width="340" height="180" class="modern-light" stroke="#3d5e3f" stroke-width="1" rx="8"/>
  <text x="450" y="375" font-size="16" class="modern-accent" font-weight="600">Fast Performance</text>
  <text x="450" y="405" font-size="13" class="modern-text" fill="#666">Optimized for speed and SEO</text>
  <circle cx="680" cy="400" r="20" class="modern-accent"/>

  <!-- Card 3 -->
  <rect x="820" y="340" width="340" height="180" class="modern-light" stroke="#3d5e3f" stroke-width="1" rx="8"/>
  <text x="840" y="375" font-size="16" class="modern-accent" font-weight="600">User Focused</text>
  <text x="840" y="405" font-size="13" class="modern-text" fill="#666">Intuitive and accessible design</text>
  <circle cx="1070" cy="400" r="20" class="modern-accent"/>

  <!-- CTA Button -->
  <rect x="450" y="600" width="300" height="50" class="modern-accent" rx="6"/>
  <text x="510" y="630" font-size="18" class="modern-nav" font-weight="600">Get Started Today</text>

  <!-- Footer hint -->
  <text x="60" y="720" font-size="12" class="modern-text" fill="#999">Building premium websites that convert</text>

  <!-- Label -->
  <rect x="450" y="650" width="300" height="60" class="modern-accent" rx="4" opacity="0.9"/>
  <text x="470" y="685" font-size="24" fill="#fafaf8" font-weight="600">Modern Design</text>
</svg>